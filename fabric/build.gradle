plugins {
    id 'multiloader-base'
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly project(':common')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    compileOnly "maven.modrinth:jade:${jade_fabric_version}"
    localRuntime "maven.modrinth:jade:${jade_fabric_version}"

    // Refined Storage: the Auto Importer card stores a farm's output in its network (only used while it is loaded).
    compileOnly("maven.modrinth:refined-storage:${refined_storage_fabric_version}") { transitive = false }
    compileOnly "teamreborn:energy:${team_reborn_energy_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${modmenu_version}"

    // Patchouli: the Easy Farms guide book is plain data, so it is only needed at runtime to see it.
    if (project.findProperty('with_patchouli')?.toString() != 'false') localRuntime "maven.modrinth:patchouli:${patchouli_fabric_version}"

    if (project.findProperty('with_content_mods')?.toString() == 'true') {
        localRuntime "maven.modrinth:refined-storage:${refined_storage_fabric_version}"
        localRuntime "maven.modrinth:cloth-config:${cloth_config_version}"
        localRuntime "teamreborn:energy:${team_reborn_energy_version}"
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach { runDir = 'run' }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}
tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
    exclude '**/.cache'
    exclude '**/*.bbmodel'

    inputs.property 'version', mod_version
    filesMatching('fabric.mod.json') { expand 'version': mod_version }
}
tasks.named('sourcesJar', Jar) {
    dependsOn configurations.commonJava
    from configurations.commonJava
}

tasks.named('jar', Jar) {
    from('../LICENSE.txt') { rename { "${it}_${mod_id}" } }
}
