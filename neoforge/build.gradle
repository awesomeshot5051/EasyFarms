plugins {
    id 'multiloader-base'
    id 'net.neoforged.moddev' version '2.0.148'
}

configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly project(':common')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    if (project.findProperty('with_emi')?.toString() == 'true') localRuntime "dev.emi:emi-neoforge:${emi_version}"

    compileOnly "curse.maven:jade-324717:${jade_neoforge_id}"
    localRuntime "curse.maven:jade-324717:${jade_neoforge_id}"
    compileOnly "curse.maven:theoneprobe-245211:${top_id}"
    localRuntime "curse.maven:theoneprobe-245211:${top_id}"

    // Patchouli: the Easy Farms guide book is plain data, so it is only needed at runtime to see it.
    localRuntime "maven.modrinth:patchouli:${patchouli_neoforge_version}"

    boolean datagen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('rundata') }
    if (project.findProperty('with_content_mods')?.toString() == 'true' && !datagen) {
        localRuntime "maven.modrinth:ae2:${ae2_version}"
        localRuntime "maven.modrinth:extended-ae:${extendedae_version}"
        localRuntime "maven.modrinth:advancedae:${advancedae_version}"
        localRuntime "maven.modrinth:geckolib:${geckolib_version}"
        localRuntime "maven.modrinth:glodium:${glodium_version}"
        localRuntime "maven.modrinth:guideme:${guideme_version}"
        if (project.findProperty('with_integrated')?.toString() == 'true') {
            localRuntime "maven.modrinth:integrated-dynamics:${id_version}"
            localRuntime "maven.modrinth:integrated-terminals:${terminals_version}"
            localRuntime "maven.modrinth:integrated-tunnels:${tunnels_version}"
            localRuntime "maven.modrinth:integrated-crafting:${crafting_version}"
            localRuntime "maven.modrinth:cyclops-core:${cyclops_version}"
            localRuntime "maven.modrinth:common-capabilities:${capabilities_version}"
        }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = project.file('run')
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Compile and package the shared code and resources as part of this loader's jar.
tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}
tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
    exclude '**/.cache'
    exclude '**/*.bbmodel'

    var props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
tasks.named('sourcesJar', Jar) {
    dependsOn configurations.commonJava
    from configurations.commonJava
}
