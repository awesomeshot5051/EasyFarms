org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Loom and ModDevGradle do not both support the configuration cache in one build.
org.gradle.configuration-cache=false

# ---- Mod ----
mod_id=easy_farms
mod_name=Easy Farms
mod_license=MIT License
mod_version=3.3.0
mod_group_id=com.awesomeshot5051.easyfarms
mod_author=awesomeshot5051

# ---- Minecraft ----
minecraft_version=26.3
minecraft_version_range=[26.3]
java_version=25

# ---- NeoForge ----
neoform_version=26.3-1
neo_version=26.3.0.102
loader_version_range=[1,)

# ---- Fabric ----
fabric_loader_version=0.20.1
fabric_loom_version=1.19.3
fabric_api_version=0.166.0+26.3

# ---- Recipe viewers / tooltips ----
jei_version=31.17.0.109
# Modrinth version numbers
jade_neoforge_version=26.3.5+neoforge
top_version=26.3_neo-16.0.2
jade_fabric_version=26.3.5+fabric
modmenu_version=21.0.0
jdt_version=8251776
# Guide book (Patchouli). Content-only: the mod ships a book as data and needs no Patchouli code.
# Set false while Patchouli has no build for this Minecraft version (26.3 has none yet); the book then just is not viewable in the dev runtime.
with_patchouli=false
patchouli_neoforge_version=2CsnFLom
patchouli_fabric_version=AveV4Tjn

# ---- Dev environment toggles ----
with_content_mods=false
with_integrated=false
ae2_version=nVSxZcom
extendedae_version=KpNzac5y
advancedae_version=hPJMJOBd
id_version=6YvxewAd
terminals_version=IpsycxKm
tunnels_version=Rs3G9GL3
cyclops_version=6YSSNROf
capabilities_version=JRpGAgAB
geckolib_version=xfVfPcoC
glodium_version=t0p0CUPy
guideme_version=OTeLaTlN
crafting_version=hQ28XP1D
refined_storage_neoforge_version=P12kjgPK
refined_storage_fabric_version=kRu67Bk2
cloth_config_version=GFM8zh9J
team_reborn_energy_version=5.0.0
# DimStorage 10.0.2 and the EdivadLib 4.0.1 it needs (26.1.2 builds)
dimstorage_version=tsOpH5Mt
edivadlib_version=srSF6gqV

# ---- CurseForge publishing (./gradlew publishCurseForge) ----
# The project number is on the project's CurseForge page ("Project ID"). The API token is NOT stored here: it is read from CFAPI.env
# in the project root (git-ignored). Put the token alone on a line, or as CURSEFORGE_TOKEN=...
curseforge_project_id=1779179
curseforge_release_type=release
# CurseForge slugs of the mods the Fabric file requires (comma separated)
curseforge_fabric_requirements=fabric-api

# ---- Modrinth publishing (run automatically after publishCurseForge, or alone with ./gradlew publishModrinth) ----
# Slug or ID from the Modrinth project page. The token is NOT stored here: it is read from MRAPI.env in the project root (git-ignored).
modrinth_project_id=VOGa2FPz
# Modrinth project IDs the Fabric file requires (comma separated); P7dR8mSH is Fabric API
modrinth_fabric_dependencies=P7dR8mSH
